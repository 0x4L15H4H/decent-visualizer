name: Verify OCI GitHub workload identity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/load-config
        with:
          ci: "true"

      - uses: Infisical/secrets-action@v1.0.16
        with:
          identity-id: ${{ env.infisical_deploy_identity_id }}
          method: oidc
          env-slug: "prod"
          project-slug: ${{ env.infisical_deploy_project_slug }}
          secret-path: "/deploy"
          export-type: env

      - uses: ./.github/actions/configure-oci-wif
        with:
          identity-domain-url: ${{ env.oci_identity_domain_url }}
          tenancy-ocid: ${{ env.oci_tenancy_ocid }}
          service-user-ocid: ${{ env.oci_wif_service_user_ocid }}
          region: ${{ env.oci_region }}

      - name: Install OCI CLI
        run: python3 -m pip install --disable-pip-version-check oci-cli

      - name: Verify OpenTofu IAM permissions
        run: |
          oci iam dynamic-group list \
            --compartment-id "$oci_tenancy_ocid" \
            --auth security_token \
            --config-file "$OCI_CONFIG_FILE" \
            --profile "$OCI_CONFIG_FILE_PROFILE" \
            --query 'data[].name' \
            --output json
